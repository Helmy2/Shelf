# Shelf book feature, iOS Reading stats flow (slice 6).
# Keep in sync with stats-android.yaml. Form fields/stars use accessibility identifiers.
# The stats body is ONE merged element whose label is the summary sentence
# "1 want to read, 0 reading, 1 finished. Average rating: 4.0 out of 5, 1 rated";
# the visual cards are hidden from accessibility, so assert on that sentence.
appId: com.shelf.ios
---
- clearState
- launchApp

# Empty shelf: no Stats action
- assertVisible: "Your shelf is empty"
- assertNotVisible: "Stats"

# Add "Dune" (Want to read)
- tapOn: "Add book"
- tapOn:
    id: "book_title_field"
- inputText: "Dune"
- pressKey: Enter
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Dune, Want to read"
    timeout: 5000

# Add "Emma" (Finished, rated 4)
- tapOn: "Add book"
- tapOn:
    id: "book_title_field"
- inputText: "Emma"
- pressKey: Enter
- tapOn: "Finished"
- tapOn:
    id: "book_rating_star_4"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Emma, Finished, rated 4 of 5"
    timeout: 5000

# Stats action now present
- tapOn: "Stats"
- extendedWaitUntil:
    visible: "Reading stats"
    timeout: 5000
- assertVisible: ".*1 want to read, 0 reading, 1 finished.*"
- assertVisible: ".*4\\.0 out of 5.*"
- assertVisible: ".*1 rated.*"

# Back to the list (system back button is labelled with the list title)
- tapOn: "Shelf"
- extendedWaitUntil:
    visible: "Dune, Want to read"
    timeout: 5000
- assertVisible: "Emma, Finished, rated 4 of 5"
